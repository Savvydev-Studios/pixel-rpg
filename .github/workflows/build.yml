# Builds the game for people who will never install Python (handoff s96, 0cq).
#
#   Windows          Pixel_RPG.exe - Python, pygame, SDL and the icon inside
#   Linux / Chromebook with Linux on
#                    pixel-rpg_<version>_amd64.deb and _arm64.deb - ChromeOS
#                    installs these from the Files app with a double-click
#   Any browser      the web build - the only way a Chromebook with Linux
#                    locked by a school can play at all - published as the
#                    repository's GitHub Pages site too
#
# Every push builds all of them and keeps them as run artifacts. A tag
# like v4.44.0 also publishes them as a GitHub Release, which is where a
# player downloads from: binaries go in a release, never in the history.

name: build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release of this version (named after pixel_rpg/__init__.py)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install -r requirements.txt "pyinstaller>=6"
      - name: Build and verify Pixel_RPG.exe
        run: python tools/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Pixel_RPG.exe
          if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      # Intel/AMD Chromebooks and ARM ones (MediaTek, Snapdragon). ARM
      # runners were public-repository-only until 2026-01-29; since then a
      # private repository gets them too, from its free minutes (s96).
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    # Built inside Debian 12, because that is what a Chromebook's Linux is:
    # a one-file build runs on the system it was built on and anything
    # newer, never on anything older.
    container: python:3.11-slim-bookworm
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          # binutils: PyInstaller reads libraries with objdump. libglib2.0-0:
          # pygame's sound needs libgthread, and a slim image has none - the
          # first build died at startup on exactly that (s96, 0cq). It has
          # to be here at build time for the build to carry it inside.
          apt-get install -y --no-install-recommends binutils libglib2.0-0
          python -m pip install -r requirements.txt "pyinstaller>=6"
      - name: Build and verify the Linux executable
        run: python tools/build_exe.py
      - name: Pack it for a Chromebook
        run: python tools/build_deb.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: pixel-rpg_*.deb
          if-no-files-found: error

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install -r requirements.txt "pygbag==0.9.3"
      - name: Build the browser version
        run: python tools/build_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          if-no-files-found: error

  release:
    # **Two ways to publish** (s96). A tag `v*` pushed to GitHub, as
    # before - or the Actions tab: *build* -> *Run workflow* with
    # "Publish a release" ticked, which names the release after the
    # version in `pixel_rpg/__init__.py`. The second exists because a
    # cloud session can push a branch but not a tag, and the exe waited
    # on that for three weeks. A release made by hand on the Releases page
    # is filled in rather than refused. The box also updates the website
    # (`pages`, below).
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [windows, linux, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip the browser version
        run: cd dist/web && zip -qr ../pixel-rpg-web.zip .
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' pixel_rpg/__init__.py)"
          fi
          [ "$tag" != "v" ] || { echo "no version in pixel_rpg/__init__.py"; exit 1; }
          files="dist/windows/Pixel_RPG.exe $(ls dist/linux-*/pixel-rpg_*.deb) dist/pixel-rpg-web.zip"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber $files
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Pixel RPG $tag" \
              --notes "Windows: download Pixel_RPG.exe and run it (the first time, Windows may say it protected your PC: More info, then Run anyway). Chromebook with Linux on: download the .deb for your Chromebook (amd64 for Intel/AMD, arm64 for ARM) and double-click it in Files. Nothing else to install. No download at all: play it in a browser at https://$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]').github.io/${GITHUB_REPOSITORY#*/}/" \
              $files
          fi

  pages:
    # **The browser version as a website** (2026-11-09, his "go ahead with
    # the github pages site"): the same `web` build the release zips, at
    # https://<owner>.github.io/<repo>/. It goes up with a release and only
    # then, so the site is always the version the download button gives -
    # and only from a run on `main`, because the `github-pages` environment
    # deploys from the default branch; a tag's release leaves the site alone.
    # Needs *Settings -> Pages -> Source: GitHub Actions*, once. Without it
    # this job fails and the release above is unaffected: switch it on and
    # re-run this job.
    #
    # Nothing here is a server. The page loads Python from
    # pygame-web.github.io in the player's browser (a network that blocks
    # that host gets a grey page), saves go to that browser's localStorage,
    # and co-op cannot run from a page (handoff s39).
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.release &&
      github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  site:
    # **Open the website the way a player does** (s97): a real browser, one
    # click when the page asks, and the game's own first console lines -
    # carrying this release's version, so a page GitHub's cache kept does
    # not pass. A grey page leaves no evidence anywhere else (s39); this
    # prints the console and every failed request, and keeps a screenshot.
    needs: pages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install a browser
        run: |
          python -m pip install "playwright==1.64.1"
          python -m playwright install --with-deps chromium
      - name: Open the site and wait for the game
        env:
          SITE: ${{ needs.pages.outputs.url }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' pixel_rpg/__init__.py)
          python tools/check_site.py "$SITE" --version "$version" --shot site.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-check
          path: site.png
          if-no-files-found: ignore
