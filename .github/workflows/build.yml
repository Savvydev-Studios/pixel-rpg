# Builds the game for people who will never install Python (handoff s96, 0cq).
#
#   Windows          Pixel_RPG.exe - Python, pygame, SDL and the icon inside
#   Linux / Chromebook with Linux on
#                    pixel-rpg_<version>_amd64.deb and _arm64.deb - ChromeOS
#                    installs these from the Files app with a double-click
#   Mac              Pixel_RPG-macOS-AppleSilicon.zip and -Intel.zip, each
#                    holding Pixel RPG.app (s98)
#   Any browser      the web build - the only way a Chromebook with Linux
#                    locked by a school can play at all - published as the
#                    repository's GitHub Pages site too
#
# Every push builds all of them and keeps them as run artifacts. A tag
# like v4.44.0 also publishes them as a GitHub Release, which is where a
# player downloads from: binaries go in a release, never in the history.

name: build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release of this version (named after pixel_rpg/__init__.py)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install -r requirements.txt "pyinstaller>=6"
      - name: Build and verify Pixel_RPG.exe
        run: python tools/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Pixel_RPG.exe
          if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      # Intel/AMD Chromebooks and ARM ones (MediaTek, Snapdragon). ARM
      # runners were public-repository-only until 2026-01-29; since then a
      # private repository gets them too, from its free minutes (s96).
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    # Built inside Debian 12, because that is what a Chromebook's Linux is:
    # a one-file build runs on the system it was built on and anything
    # newer, never on anything older.
    container: python:3.11-slim-bookworm
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          # binutils: PyInstaller reads libraries with objdump. libglib2.0-0:
          # pygame's sound needs libgthread, and a slim image has none - the
          # first build died at startup on exactly that (s96, 0cq). It has
          # to be here at build time for the build to carry it inside.
          apt-get install -y --no-install-recommends binutils libglib2.0-0
          python -m pip install -r requirements.txt "pyinstaller>=6"
      - name: Build and verify the Linux executable
        run: python tools/build_exe.py
      - name: Pack it for a Chromebook
        run: python tools/build_deb.py
      - name: Measure every screen in a Chromebook's font
        # A Chromebook's Linux is this same Debian 12, and with no Consolas
        # the game resolves DejaVu Sans Mono: four pixels taller a line than
        # the faces it was drawn in, and 34 layout problems until 4.48.0
        # (s98). After the packing, so nothing here reaches the .deb.
        if: matrix.arch == 'amd64'
        run: |
          apt-get install -y --no-install-recommends fonts-dejavu-core fontconfig
          python tests/layout.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: pixel-rpg_*.deb
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      # One app per kind of Mac (s98). pygame ships separate Apple Silicon
      # and Intel wheels, so there is no one build that is both. GitHub's
      # last Intel image is macos-15-intel, kept until macOS 15 is retired
      # in fall 2027 (checked 2026-11-10); after that an Intel build needs
      # another way, or Apple Silicon alone.
      matrix:
        include:
          - { runner: macos-15, arch: AppleSilicon }
          - { runner: macos-15-intel, arch: Intel }
    runs-on: ${{ matrix.runner }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install -r requirements.txt "pyinstaller>=6"
      - name: Build and verify Pixel RPG.app
        run: python tools/build_exe.py
      - name: Check the app's signature is whole
        # PyInstaller signs the app ad hoc, and an Apple Silicon Mac will not
        # run code without a signature. A seal broken after signing is what
        # macOS reports as "damaged" - so it is caught here instead.
        run: codesign --verify --deep --strict --verbose=2 "dist/Pixel RPG.app"
      - name: Show the oldest macOS it runs on
        run: |
          otool -l "dist/Pixel RPG.app/Contents/MacOS/Pixel_RPG" | grep -A4 LC_BUILD_VERSION | grep -E "minos" || true
          find "dist/Pixel RPG.app" -name "libpython*.dylib" -exec otool -l {} \; | grep -A4 LC_BUILD_VERSION | grep -E "minos" | sort -u || true
      - name: Measure every screen in the Mac's own font
        # The game asks for Consolas, then DejaVu, then Menlo; a Mac has
        # Menlo. "0 layout problems" is a claim about a font (s94), so this
        # makes it a claim about the one a Mac player sees.
        if: matrix.arch == 'AppleSilicon'
        run: python tests/layout.py
      - name: Zip it the way a Mac does
        # ditto keeps the bundle's symlinks and signature; Safari unzips it
        # on download and leaves Pixel RPG.app in Downloads.
        run: ditto -c -k --keepParent "dist/Pixel RPG.app" "Pixel_RPG-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: Pixel_RPG-macOS-*.zip
          if-no-files-found: error

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install -r requirements.txt "pygbag==0.9.3"
      - name: Build the browser version
        run: python tools/build_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          if-no-files-found: error

  browsers:
    # **The browser build opened in three browsers, before anything is
    # published** (s98): Chromium (Chrome, Edge, every Chromebook), Firefox,
    # and WebKit (Safari's engine). Served by a plain static server - which
    # is all a web host is - at 127.0.0.1 and not at "localhost": pygbag
    # treats a localhost page as its own developer server and asks it for
    # pieces a real host never serves (s97). A release waits for all three.
    needs: web
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: site
      - name: Install a browser
        run: |
          python -m pip install "playwright==1.64.1"
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Open the build and wait for the game
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory site > server.log 2>&1 &
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' pixel_rpg/__init__.py)
          python tools/check_site.py http://127.0.0.1:8000/ --engine ${{ matrix.engine }} --version "$version" --shot ${{ matrix.engine }}.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.engine }}
          path: ${{ matrix.engine }}.png
          if-no-files-found: ignore

  release:
    # **Two ways to publish** (s96). A tag `v*` pushed to GitHub, as
    # before - or the Actions tab: *build* -> *Run workflow* with
    # "Publish a release" ticked, which names the release after the
    # version in `pixel_rpg/__init__.py`. The second exists because a
    # cloud session can push a branch but not a tag, and the exe waited
    # on that for three weeks. A release made by hand on the Releases page
    # is filled in rather than refused. The box also updates the website
    # (`pages`, below).
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [windows, linux, macos, web, browsers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip the browser version
        run: cd dist/web && zip -qr ../pixel-rpg-web.zip .
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' pixel_rpg/__init__.py)"
          fi
          [ "$tag" != "v" ] || { echo "no version in pixel_rpg/__init__.py"; exit 1; }
          files="dist/windows/Pixel_RPG.exe $(ls dist/linux-*/pixel-rpg_*.deb) $(ls dist/macos-*/Pixel_RPG-macOS-*.zip) dist/pixel-rpg-web.zip"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber $files
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Pixel RPG $tag" \
              --notes "Windows: download Pixel_RPG.exe and run it (the first time, Windows may say it protected your PC: More info, then Run anyway). Mac: download the zip for your Mac (AppleSilicon for M1 and later, Intel for older ones), open Pixel RPG.app, and the first time allow it in System Settings, Privacy and Security, Open Anyway. Chromebook with Linux on: download the .deb for your Chromebook (amd64 for Intel/AMD, arm64 for ARM) and double-click it in Files. Nothing else to install. No download at all: play it in a browser at https://$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]').github.io/${GITHUB_REPOSITORY#*/}/" \
              $files
          fi

  pages:
    # **The browser version as a website** (2026-11-09, his "go ahead with
    # the github pages site"): the same `web` build the release zips, at
    # https://<owner>.github.io/<repo>/. It goes up with a release and only
    # then, so the site is always the version the download button gives -
    # and only from a run on `main`, because the `github-pages` environment
    # deploys from the default branch; a tag's release leaves the site alone.
    # Needs *Settings -> Pages -> Source: GitHub Actions*, once. Without it
    # this job fails and the release above is unaffected: switch it on and
    # re-run this job.
    #
    # Nothing here is a server. The page loads Python from
    # pygame-web.github.io in the player's browser (a network that blocks
    # that host gets a grey page), saves go to that browser's localStorage,
    # and co-op cannot run from a page (handoff s39).
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.release &&
      github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  site:
    # **Open the website the way a player does** (s97): a real browser, one
    # click when the page asks, and the game's own first console lines -
    # carrying this release's version, so a page GitHub's cache kept does
    # not pass. A grey page leaves no evidence anywhere else (s39); this
    # prints the console and every failed request, and keeps a screenshot.
    needs: pages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install a browser
        run: |
          python -m pip install "playwright==1.64.1"
          python -m playwright install --with-deps chromium
      - name: Open the site and wait for the game
        env:
          SITE: ${{ needs.pages.outputs.url }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' pixel_rpg/__init__.py)
          python tools/check_site.py "$SITE" --version "$version" --shot site.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-check
          path: site.png
          if-no-files-found: ignore
